services:
  - type: web
    name: rainguard-ethiopia-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENABLE_NDVI
        value: "1"
      - key: PYTHON_VERSION
        value: 3.12.8
